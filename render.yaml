# Render Blueprint (optional): New → Blueprint → paste this file.
# Set MONGODB_URI (and optional API_SERVICE_KEY) in the dashboard — do not commit secrets.
#
# Two services from one repo:
#   - agri-credit-pipeline-api  (Docker / FastAPI under backend/Credit_assessment)
#   - agri-credit-frontend      (Node / Next.js in frontend/)
#
# buildFilter limits redeploys: frontend-only pushes skip the API Docker rebuild (and vice versa).

services:
  - type: web
    name: agri-credit-pipeline-api
    runtime: docker
    dockerfilePath: ./backend/Credit_assessment/Dockerfile
    dockerContext: ./backend/Credit_assessment
    plan: free
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/Credit_assessment/**
        - render.yaml
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: agristack
      - key: ML_MODE
        value: rule_based
      - key: USE_MONGODB
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      # - key: API_SERVICE_KEY
      #   sync: false

  - type: web
    name: agri-credit-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: agristack
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_DOMAIN
        sync: false
      # Point at the API service URL after both are live, e.g. https://agri-credit-pipeline-api.onrender.com
      - key: PIPELINE_API_URL
        sync: false
