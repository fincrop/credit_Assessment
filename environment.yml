name: agri_credit
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.11
  
  # Geospatial stack (let conda resolve compatible versions)
  - gdal>=3.6,<3.9
  - rasterio>=1.3,<1.4
  - shapely>=2.0,<2.1
  - geopandas>=0.12,<0.15
  - fiona>=1.9,<1.10
  - proj>=9.1,<10
  - geos>=3.11,<3.13
  
  # Numerical computing (NumPy 1.x - critical!)
  - numpy>=1.23,<2.0
  - scipy>=1.10,<1.12
  - pandas>=1.5,<2.2
  
  # Machine Learning
  - scikit-learn>=1.2,<1.4
  - joblib>=1.2
  
  # Other packages
  - requests>=2.28
  - python-dateutil>=2.8
  - certifi
  
  # Pip packages
  - pip>=23.0
  - pip:
    - pystac-client>=0.7
    - planetary-computer>=1.0
    - pymongo>=4.3
    - dnspython>=2.3
    - xgboost>=1.7,<2.0